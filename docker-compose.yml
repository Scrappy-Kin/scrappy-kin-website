version: '3.8'

services:
  scrappykin-web:
    image: nginx:alpine
    container_name: scrappykin-web
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy-network
    # No healthcheck needed - nginx is stateless, Docker restart handles crashes

networks:
  caddy-network:
    external: true
